[project]
name = "travel-style-agent"
version = "0.1.0"
description = "Group 17 travel style agent — shared LangChain development scaffold"
requires-python = ">=3.11,<3.12"
dependencies = ["langchain>=1,<2", "langgraph>=1,<2", "pydantic>=2,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
openai = ["langchain-openai>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
