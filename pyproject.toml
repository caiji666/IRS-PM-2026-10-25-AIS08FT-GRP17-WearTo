[project]
name = "travel-style-agent"
version = "0.1.0"
description = "Group 17 travel style agent — shared LangChain development scaffold"
requires-python = ">=3.11,<3.12"
dependencies = ["langchain>=1,<2", "langgraph>=1,<2", "pydantic>=2,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
openai = ["langchain-openai>=1,<2"]
qwen = [
    "torch>=2.6,<3",
    "transformers>=4.51,<5",
]
neo4j = [
    "neo4j>=5,<7",
]
products = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pillow>=10,<12",
    "requests>=2.32,<3",
    "torch>=2.6,<2.9",
    "transformers==4.57.6",
]
inspiration = [
    "pillow>=10,<12",
    "requests>=2.32,<3",
    "torch>=2.6,<2.9",
    "transformers==4.57.6",
]
inspiration-eval = [
    "google-genai>=1,<3",
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.5,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "full_pipeline_live: five-module run; model, network or credential stages run only with RUN_FULL_PIPELINE_TESTS=1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"travel_agent/products/retrieval/**" = ["E501"]
"tests/product_retrieval/**" = ["E501"]
